[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immunotargetnet"
version = "1.0.0"
description = "Immune-relevance bottleneck for multimodal multi-omics target prioritisation in psoriasis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ImmunoTargetNet authors" }]
keywords = ["psoriasis", "target prioritisation", "multi-omics", "single-cell", "spatial transcriptomics"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "black>=24.0", "isort>=5.13", "mypy>=1.11"]

[project.scripts]
immunotargetnet-build-evidence = "immunotargetnet.cli.build_evidence:main"
immunotargetnet-train = "immunotargetnet.cli.train:main"
immunotargetnet-evaluate = "immunotargetnet.cli.evaluate:main"
immunotargetnet-prioritise = "immunotargetnet.cli.prioritise:main"
immunotargetnet-verify = "immunotargetnet.cli.verify:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["immunotargetnet*"]

[tool.setuptools.package-data]
immunotargetnet = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".git", "runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "RET", "C4", "PIE", "TID", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
combine_as_imports = true
force_sort_within_sections = false
known_first_party = ["immunotargetnet"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/immunotargetnet"]
exclude = ["tests", "scripts"]
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["torch.*", "scipy.*", "yaml.*"]
ignore_missing_imports = true
